  <text x="100" y="2955" class="title">How to use</text>
  <text x="100" y="2985" class="item">• Follow top→down. Complete fundamentals before moving to specialized modules (NLP, CV, Transformers).</text>
  <text x="100" y="3010" class="item">• For hands-on, open the folder with the matching number in the repo and follow its README / notebooks.</text>

